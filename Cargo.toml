[package]
name = "pathplanning"
version = "0.1.0"
edition = "2024"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
description = "Path planning algorithms and visualization"
repository = "https://github.com/sunsided/pathplanning"
license = "EUPL-1.2"
publish = false
keywords = ["pathfinding", "planning", "algorithms", "routing"]

[lib]
name = "pathplanning"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pathplanning"
path = "src/main.rs"

[dependencies]
winit = "0.30"
vello = "0.8"
ordered-float = "5"
rstar = "0.12"
space-partitioning = "0.5.0"
log = "0.4"
rand = { version = "0.10", features = ["std_rng"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fast-osmpbf = { git = "https://github.com/sunsided/fast-osmpbf", branch = "feature/memmap", features = ["mmap", "io-hints"] }
env_logger = "0.11"
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
]
