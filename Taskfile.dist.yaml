version: "3"

vars:
  CARGO: cargo
  MAP: maps/berlin.osm.pbf
  WEB_DIR: web
  WEB_DIST: dist
  WEB_BBOX: "52.49,13.36,52.55,13.47"
  WEB_PORT: "8081"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  fmt:
    desc: Apply Rust formatting
    aliases:
      - fmt:fix
    cmds:
      - "{{.CARGO}} fmt"

  fmt:check:
    desc: Check Rust formatting
    cmds:
      - "{{.CARGO}} fmt -- --check"

  check:
    desc: Check the crate with default features
    cmds:
      - "{{.CARGO}} check"

  check:all-features:
    desc: Check the crate with all features
    cmds:
      - "{{.CARGO}} check --all-features --all-targets"

  check:no-features:
    desc: Check the crate without default features
    cmds:
      - "{{.CARGO}} check --no-default-features"

  lint:
    desc: Check clippy lints for all targets and features
    aliases:
      - lint:check
    cmds:
      - "{{.CARGO}} clippy --all-features --all-targets"

  lint:fix:
    desc: Apply clippy fixes for all targets and features
    aliases:
      - clippy
    cmds:
      - "{{.CARGO}} clippy --fix --allow-dirty --all-features --all-targets"

  build:
    desc: Build the crate with default features
    cmds:
      - "{{.CARGO}} build"

  run:
    desc: Run the crate with default features
    env:
      WGPU_BACKEND: vulkan
      RUST_LOG: info
    cmds:
      - "{{.CARGO}} run --release"

  test:
    desc: Test the crate with all features
    aliases:
      - test:all
    cmds:
      - "{{.CARGO}} test --all-features"

  test:all-features:
    desc: Test the crate with all features (alias for test)
    cmds:
      - "{{.CARGO}} test --all-features"

  test:no-features:
    desc: Test the crate without default features
    cmds:
      - "{{.CARGO}} test --no-default-features"

  verify:
    desc: Run formatting checks, static checks, clippy, and the test matrix
    deps:
      - fmt:check
      - check:all-features
      - check:no-features
      - lint:check
      - test
      - test:all-features
      - test:no-features

  clean:
    desc: Remove Cargo build artifacts
    cmds:
      - "{{.CARGO}} clean"

  check:wasm:
    desc: Type-check the library for wasm32
    cmds:
      - "{{.CARGO}} check --target wasm32-unknown-unknown --lib"

  export:graph:
    desc: Export a compact graph asset for the web build
    cmds:
      - "{{.CARGO}} run --release --bin pathplanning -- --export {{.MAP}} {{.WEB_DIR}}/graph.bin.gz {{.WEB_BBOX}}"

  wasm:build:
    desc: Build the WebAssembly module with wasm-pack
    cmds:
      - wasm-pack build --target web --release --out-dir {{.WEB_DIR}}/pkg --out-name pathplanning

  web:build:
    desc: Build the web application (graph asset + wasm module)
    deps:
      - export:graph
      - wasm:build

  web:serve:
    desc: Serve the web build locally
    deps:
      - web:build
    cmds:
      - python3 -m http.server {{.WEB_PORT}} --bind 127.0.0.1 --directory {{.WEB_DIR}}

  web:dist:
    desc: Assemble the deployable GitHub Pages artifact in dist/
    deps:
      - web:build
    cmds:
      - rm -rf {{.WEB_DIST}}
      - mkdir -p {{.WEB_DIST}}/pkg
      - cp {{.WEB_DIR}}/index.html {{.WEB_DIST}}/
      - cp {{.WEB_DIR}}/graph.bin.gz {{.WEB_DIST}}/
      - cp {{.WEB_DIR}}/pkg/pathplanning.js {{.WEB_DIR}}/pkg/pathplanning_bg.wasm {{.WEB_DIR}}/pkg/pathplanning.d.ts {{.WEB_DIST}}/pkg/

